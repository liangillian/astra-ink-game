<div class="panel">
 <div class="kicker">PROCEDURAL CARD FACTORY</div>
 <h1>ASTRA:INK 卡牌自動設計工坊</h1>
 <p>這裡會依角色個性、季節、日韓中英風格、星級，自動組合服裝、配件、背景與卡名。現在這版會用角色現有照片作為人物底圖，再自動生成不同卡面設計與企劃描述。</p>

 <div class="factoryControls">
  <label>角色<select id="characterSel"></select></label>
  <label>季節<select id="seasonSel"><option value="random">隨機</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label>
  <label>風格<select id="regionSel"><option value="random">隨機</option><option value="jp">日系</option><option value="kr">韓系</option><option value="cn">中式</option><option value="uk">英倫</option></select></label>
  <label>星級<select id="starSel"><option value="random">隨機</option><option value="5">5★</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option><option value="1">1★</option></select></label>
 </div>
 <div class="musicRow" style="margin-top:14px">
  <button class="btn gold" id="generateBtn">自動產出 1 張</button>
  <button class="btn primary" id="generateSixBtn">自動產出 6 張</button>
  <button class="btn" id="saveToPoolBtn">把目前結果加入自訂卡池</button>
 </div>
</div>

<div id="generated" class="generatedGrid"></div>

<div class="panel" style="margin-top:14px">
 <h2>真正 AI 生圖的差別</h2>
 <p class="mini">目前工坊會自動產生「卡牌企劃＋卡面風格」；若你要每次都生成全新服裝與全新人物照片，必須另外串接後端 AI 圖像 API。不能把 API 金鑰直接放 GitHub Pages，否則會被公開。</p>
</div>
</div>
